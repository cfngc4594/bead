name: Android

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "apps/client/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "nx.json"
      - ".github/workflows/android.yml"
      - ".github/actions/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/client/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "nx.json"
      - ".github/workflows/android.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      deploy_env:
        description: Deployment environment
        required: true
        type: choice
        options:
          - production
          - preview

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-android:
    name: Validate Android build (${{ (github.base_ref || github.ref_name) == 'develop' && 'Preview' || 'Production' }})
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BEAD_DEPLOY_ENV: ${{ (github.base_ref || github.ref_name) == 'develop' && 'preview' || 'production' }}
      VITE_API_URL: ${{ (github.base_ref || github.ref_name) == 'develop' && vars.VITE_API_URL_PREVIEW || vars.VITE_API_URL }}
      VITE_UMAMI_SCRIPT_URL: ${{ (github.base_ref || github.ref_name) == 'develop' && vars.VITE_UMAMI_SCRIPT_URL_PREVIEW || vars.VITE_UMAMI_SCRIPT_URL }}
      VITE_UMAMI_WEBSITE_ID: ${{ (github.base_ref || github.ref_name) == 'develop' && vars.VITE_UMAMI_WEBSITE_ID_PREVIEW || vars.VITE_UMAMI_WEBSITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Validate build environment
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL repository variable is required for Android builds." >&2
            exit 1
          fi

      - name: Add Android platform
        run: bun run cap:add:android

      - name: Sync Android platform
        run: bun run cap:sync:android

      - name: Validate release build
        working-directory: apps/client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

  release-android:
    name: Release Android APK (${{ (github.event_name == 'workflow_dispatch' && (inputs.deploy_env == 'preview' && 'Preview' || 'Production')) || (github.ref == 'refs/heads/develop' && 'Preview') || 'Production' }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ (github.event_name == 'workflow_dispatch' && (inputs.deploy_env == 'preview' && 'Preview' || 'Production')) || (github.ref == 'refs/heads/develop' && 'Preview') || 'Production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BEAD_DEPLOY_ENV: ${{ vars.BEAD_DEPLOY_ENV }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_UMAMI_SCRIPT_URL: ${{ vars.VITE_UMAMI_SCRIPT_URL }}
      VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Validate build environment
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL is required in the active GitHub environment." >&2
            exit 1
          fi

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "$key is required in the active GitHub environment secrets." >&2
              exit 1
            fi
          done

      - name: Generate release metadata
        id: version
        shell: bash
        run: |
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          if [ "$BEAD_DEPLOY_ENV" = "preview" ]; then
            echo "date=" >> "$GITHUB_OUTPUT"
            echo "version_name=0.1.${{ github.run_number }}-preview" >> "$GITHUB_OUTPUT"
            echo "artifact_name=bead-android-preview-0.1.${{ github.run_number }}-preview" >> "$GITHUB_OUTPUT"
            echo "apk_filename=Bead-preview.apk" >> "$GITHUB_OUTPUT"
            echo "release_tag=android-preview-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release_name=Bead Android Preview v0.1.${{ github.run_number }}-preview" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"
            echo "version_name=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=bead-android-0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "apk_filename=Bead.apk" >> "$GITHUB_OUTPUT"
            echo "release_tag=android-v$(date -u +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release_name=Bead Android v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Android platform
        run: bun run cap:add:android

      - name: Sync Android platform
        run: bun run cap:sync:android

      - name: Set Android app version
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          build_gradle="apps/client/android/app/build.gradle"
          sed -i -E \
            "s/versionCode [0-9]+/versionCode $VERSION_CODE/" \
            "$build_gradle"
          sed -i -E \
            "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/" \
            "$build_gradle"

          grep -q "versionCode $VERSION_CODE" "$build_gradle"
          grep -q "versionName \"$VERSION_NAME\"" "$build_gradle"

      - name: Build unsigned release APK
        working-directory: apps/client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        id: sign_apk
        uses: r0adkll/sign-android-release@d5f8436b702872ad5cdb1e6e4d5c8b983d25a997 # Node 24
        with:
          releaseDirectory: apps/client/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Remove decoded signing key
        if: always()
        run: rm -f apps/client/android/app/build/outputs/apk/release/signingKey.jks

      - name: Prepare signed APK
        id: signed_apk
        env:
          SIGNED_APK: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          APK_FILENAME: ${{ steps.version.outputs.apk_filename }}
        run: |
          test -f "$SIGNED_APK"
          cp "$SIGNED_APK" "$RUNNER_TEMP/$APK_FILENAME"
          echo "path=$RUNNER_TEMP/$APK_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ steps.signed_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: ${{ steps.signed_apk.outputs.path }}
          fail_on_unmatched_files: true
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            Android signed release APK build (${{ github.environment }})

            Version: ${{ steps.version.outputs.version_name }}
            Build #${{ github.run_number }}
            Commit: ${{ github.sha }}
            Date: ${{ steps.version.outputs.timestamp }}
          draft: false
          prerelease: ${{ github.environment == 'Preview' }}
          make_latest: ${{ github.environment == 'Production' }}
