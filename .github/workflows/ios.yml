name: iOS

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "apps/client/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "nx.json"
      - ".github/workflows/ios.yml"
      - ".github/workflows/mobile-release.yml"
      - ".github/actions/**"

concurrency:
  group: ios-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ios:
    name: Validate iOS build (${{ (github.base_ref || github.ref_name) == 'develop' && 'Preview' || 'Production' }})
    if: github.event.action != 'closed'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BEAD_DEPLOY_ENV: ${{ (github.base_ref || github.ref_name) == 'develop' && 'preview' || 'production' }}
      VITE_API_URL: ${{ (github.base_ref || github.ref_name) == 'develop' && vars.VITE_API_URL_PREVIEW || vars.VITE_API_URL }}
      VITE_UMAMI_SCRIPT_URL: ${{ (github.base_ref || github.ref_name) == 'develop' && vars.VITE_UMAMI_SCRIPT_URL_PREVIEW || vars.VITE_UMAMI_SCRIPT_URL }}
      VITE_UMAMI_WEBSITE_ID: ${{ (github.base_ref || github.ref_name) == 'develop' && vars.VITE_UMAMI_WEBSITE_ID_PREVIEW || vars.VITE_UMAMI_WEBSITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Validate build environment
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL repository variable is required for iOS builds." >&2
            exit 1
          fi

      - name: Add iOS platform
        run: bun run cap:add:ios

      - name: Sync iOS platform
        run: bun run cap:sync:ios

      - name: Validate unsigned release build
        working-directory: apps/client/ios/App
        run: |
          if [ -d App.xcworkspace ]; then
            project_args=(-workspace App.xcworkspace)
          else
            project_args=(-project App.xcodeproj)
          fi

          xcodebuild build \
            "${project_args[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
