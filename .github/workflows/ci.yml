name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "nx.json"
      - "biome.json"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      site: ${{ steps.filter.outputs.site }}
      client: ${{ steps.filter.outputs.client }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@91e6386442053180703fea55f99b7c2d21326728 # v3.0.2
        with:
          filters: |
            shared:
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'nx.json'
              - 'biome.json'
              - 'packages/**'
            site:
              - 'apps/site/**'
            client:
              - 'apps/client/**'
            api:
              - 'apps/api/**'

  lint:
    name: Lint
    needs: changes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      (
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.site == 'true' ||
        needs.changes.outputs.client == 'true' ||
        needs.changes.outputs.api == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Typecheck
        run: bun run typecheck

  site:
    name: Build site (${{ github.base_ref == 'develop' && 'Preview' || 'Production' }})
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      (
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.site == 'true'
      )
    environment: ${{ github.base_ref == 'develop' && 'preview' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Validate site build environment
        run: |
          for key in VITE_SITE_GITHUB_URL VITE_SITE_WEB_APP_URL VITE_SITE_ANDROID_URL VITE_SITE_IOS_URL; do
            if [ -z "${!key}" ]; then
              echo "$key is required in the active GitHub environment." >&2
              exit 1
            fi
          done

      - name: Build site
        run: bun run build:site

  client-web:
    name: Build client web (${{ github.base_ref == 'develop' && 'Preview' || 'Production' }})
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      (
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.client == 'true'
      )
    environment: ${{ github.base_ref == 'develop' && 'preview' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Validate client build environment
        run: |
          for key in VITE_API_URL VITE_UMAMI_SCRIPT_URL VITE_UMAMI_WEBSITE_ID; do
            if [ -z "${!key}" ]; then
              echo "$key is required in the active GitHub environment." >&2
              exit 1
            fi
          done

      - name: Build client web
        run: bun run build:client

  api:
    name: Build api
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      (
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.api == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build api
        run: bun run --cwd apps/api build
