name: Setup monorepo
description: Install monorepo dependencies with Bun. Run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
